name: Release

on:
  push:
    tags: ["v*"]
  # Build a tag pushed while Actions was off: gh workflow run release.yml --ref v0.1.0
  # (on a branch ref the notes and version checks below fail before any build).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fail in seconds, before any build, if the notes for this tag are missing
  # or still carry a placeholder such as {{PLATFORM_TEST_NOTE}}, or if the
  # changelog has no heading for this version.
  notes:
    runs-on: ubuntu-latest
    env:
      NOTES: .github/release-notes/${{ github.ref_name }}.md
    steps:
      - uses: actions/checkout@v4
      - name: Release notes exist and are final
        run: |
          test -f "$NOTES" || { echo "missing $NOTES"; exit 1; }
          if grep -n '{{' "$NOTES"; then echo "placeholder left in $NOTES"; exit 1; fi
      - name: Changelog has this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || { echo "no '## $v' heading in CHANGELOG.md"; exit 1; }

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          crate_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$crate_ver" = "$VERSION" ] || { echo "tag $VERSION != crate $crate_ver"; exit 1; }
      - run: cargo build --locked --release --features cjk-font --target ${{ matrix.target }}
      - name: Collect license notices
        shell: bash
        run: |
          mkdir -p licenses
          cp LICENSE-MIT LICENSE-APACHE licenses/
          cp assets/LICENSE-*.txt licenses/
          cp vendor/egui_term/LICENSE licenses/LICENSE-MIT-egui_term.txt
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          cp -R "$GITHUB_WORKSPACE/licenses" .
          7z a "$GITHUB_WORKSPACE/nanomd-$VERSION-${{ matrix.target }}.zip" nanomd.exe licenses
      - name: Package (macOS .app in tar.gz)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" assets/icon-512.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o nanomd.icns
          app=nanomd.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp assets/macos/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${VERSION#v}" \
            -c "Set :CFBundleVersion ${VERSION#v}" \
            "$app/Contents/Info.plist"
          cp "target/${{ matrix.target }}/release/nanomd" "$app/Contents/MacOS/nanomd"
          cp nanomd.icns "$app/Contents/Resources/nanomd.icns"
          cp -R licenses "$app/Contents/Resources/"
          tar -czf "nanomd-$VERSION-${{ matrix.target }}.tar.gz" "$app"
      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          cp -R "$GITHUB_WORKSPACE/licenses" .
          tar -czf "$GITHUB_WORKSPACE/nanomd-$VERSION-${{ matrix.target }}.tar.gz" nanomd licenses
      - name: Smoke-test the packaged artifact
        shell: bash
        run: |
          mkdir smoke && cd smoke
          case "${{ matrix.target }}" in
            *windows*)
              7z x "../nanomd-$VERSION-${{ matrix.target }}.zip" >/dev/null
              bin=./nanomd.exe
              license_dir=licenses ;;
            *apple*)
              tar -xzf "../nanomd-$VERSION-${{ matrix.target }}.tar.gz"
              bin=./nanomd.app/Contents/MacOS/nanomd
              license_dir=nanomd.app/Contents/Resources/licenses
              # macos-latest is arm64: the x86_64 build needs Rosetta to run.
              if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                sudo softwareupdate --install-rosetta --agree-to-license || true
                if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                  [ "$(lipo -archs "$bin")" = x86_64 ] || { echo "not an x86_64 binary"; exit 1; }
                  echo "Rosetta unavailable: checking the architecture and licenses only"
                  arch_only=1
                fi
              fi ;;
            *)
              tar -xzf "../nanomd-$VERSION-${{ matrix.target }}.tar.gz"
              bin=./nanomd
              license_dir=licenses ;;
          esac
          for license in LICENSE-MIT LICENSE-APACHE LICENSE-MIT-egui_term.txt \
            LICENSE-OFL-NotoSansCJK.txt LICENSE-OFL-NotoEmoji.txt LICENSE-Hack.txt \
              LICENSE-Ubuntu.txt LICENSE-MIT-EmojiIcons.txt LICENSE-MIT-Phosphor.txt \
              LICENSE-OFL-STIXTwoMath.txt LICENSE-MIT-LaTeX-Rust.txt; do
            test -f "$license_dir/$license" || { echo "missing license: $license"; exit 1; }
          done
          [ -z "${arch_only:-}" ] || exit 0
          out=$("$bin" --version)
          [ "$out" = "nanomd ${VERSION#v}" ] || { echo "smoke test failed: got '$out'"; exit 1; }
          echo "smoke OK: $out"
      - uses: actions/upload-artifact@v4
        with:
          name: nanomd-${{ matrix.target }}
          path: |
            nanomd-*.zip
            nanomd-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum nanomd-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nanomd-*
            SHA256SUMS.txt
          body_path: .github/release-notes/${{ github.ref_name }}.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      # The Windows save/recovery tests skip themselves when CI is set (see
      # skip_on_windows_ci in src/doc.rs). Run them anyway, without failing
      # the job, so each run shows which ones hold on the hosted runner.
      - name: Windows save tests on the hosted runner (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          NANOMD_RUN_WINDOWS_SAVE_TESTS: "1"
        run: cargo test --locked --bin nanomd
      - run: cargo test --locked --manifest-path vendor/egui_term/Cargo.toml --lib
      - run: cargo build --locked --release --features cjk-font
      # Finder hands a file to the app as an Apple Event, not on the command
      # line (#23); `open -a` sends the same event. Opening a file adds it to
      # the recent list, and a second file opens in a window of its own.
      - name: Open files the way Finder does (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p nanomd.app/Contents/MacOS
          cp assets/macos/Info.plist nanomd.app/Contents/
          cp target/release/nanomd nanomd.app/Contents/MacOS/
          for f in first second; do
            echo "# $f" > "$RUNNER_TEMP/$f.md"
            open -a "$PWD/nanomd.app" "$RUNNER_TEMP/$f.md"
            for _ in $(seq 30); do
              grep -q "/$f.md$" ~/.config/nanomd/recent 2>/dev/null && break
              sleep 1
            done
            grep "/$f.md$" ~/.config/nanomd/recent
          done
          test "$(pgrep -x nanomd | wc -l)" -eq 2
          pkill -x nanomd

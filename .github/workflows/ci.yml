name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      # The Windows save/recovery tests skip themselves when CI is set (see
      # skip_on_windows_ci in src/doc.rs). Run them anyway, without failing
      # the job, so each run shows which ones hold on the hosted runner.
      - name: Windows save tests on the hosted runner (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          NANOMD_RUN_WINDOWS_SAVE_TESTS: "1"
        run: cargo test --locked --bin nanomd
      - run: cargo test --locked --manifest-path vendor/egui_term/Cargo.toml --lib
      - run: cargo build --locked --release --features cjk-font
